name: FOTOPOLIS Quality Gates

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/qa.mjs"
      - "scripts/browser-qa.mjs"
      - "scripts/make-review-contact-sheet.py"
      - "netlify.toml"
      - ".github/workflows/quality-gates.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  technical:
    name: Technical QA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify links, approved logo and PWA
        run: node scripts/qa.mjs --technical

  premium:
    name: Generated preview integrity gate
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image processor
        run: python -m pip install --disable-pip-version-check "Pillow>=10,<12"
      - name: Build actual public preview from approved sources
        run: python3 scripts/build-premium-preview.py
      - name: Check all active routes, product images, 32 designs and secure forms
        run: node scripts/visual-release-qa.mjs

  browser:
    name: Rendered Browser QA and screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local preview server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory site >/tmp/fotopolis-server.log 2>&1 &
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:8765/ >/dev/null
      - name: Test desktop and mobile with screenshots
        run: node scripts/browser-qa.mjs
      - name: Generate review contact sheet
        if: always()
        run: |
          python3 -m pip install --quiet --break-system-packages pillow
          python3 scripts/make-review-contact-sheet.py
      - name: Save screenshots and browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fotopolis-browser-qa
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14
