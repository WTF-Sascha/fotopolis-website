name: FOTOPOLIS V4 Deep Visual & Functional Audit
on:
  push:
    branches: ["design/premium-v2"]
    paths:
      - "scripts/reference-v4-audit.mjs"
      - "scripts/reference-v4-mobile-band-qa.mjs"
      - "concepts/premium-v2/index.html"
      - "concepts/premium-v2/reference-v4.css"
      - "concepts/premium-v2/reference-v4.js"
      - "scripts/build_premium_pages.py"
      - "scripts/build-premium-preview.py"
      - ".github/workflows/reference-v4-deep-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deep-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium and build deps
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Generate exact Netlify deploy output
        run: python3 scripts/build-premium-preview.py
      - name: Start preview webserver
        run: |
          python3 -m http.server 8766 --bind 127.0.0.1 --directory preview-build >/tmp/fotopolis-v4-audit.log 2>&1 &
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:8766/ >/dev/null
      - name: Deep inspect 12 routes and 15 breakpoints
        env:
          SITE_BASE_URL: http://127.0.0.1:8766/
          QA_STRICT: "0"
        run: node scripts/reference-v4-audit.mjs
      - name: Regression test Android hero and beige info band at 14 widths
        env:
          SITE_BASE_URL: http://127.0.0.1:8766/
        run: node scripts/reference-v4-mobile-band-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fotopolis-v4-deep-audit
          path: |
            concepts/premium-v2/qa-screenshots/reference-v4-audit/
            concepts/premium-v2/qa-screenshots/mobile-band/
          retention-days: 30
          if-no-files-found: warn
