name: Verify FOTOPOLIS preview link is publicly reachable
on:
  push:
    branches: ["design/premium-v2"]
    paths:
      - ".github/workflows/verify-preview-link.yml"
      - "concepts/premium-v2/index.html"
      - "concepts/premium-v2/studio-v5.css"
      - "concepts/premium-v2/studio-v5.js"
      - "scripts/build-premium-preview.py"
      - "scripts/build_premium_pages.py"
      - "concepts/premium-v2/pages.json"
      - "concepts/premium-v2/product-v6.css"
      - "concepts/premium-v2/product-enquiry-v6.js"
      - "concepts/premium-v2/contact-flow.js"
      - "scripts/product-v6-qa.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  external-preview-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Studio 7.0 images, editorial layouts and two-step enquiries on public Netlify preview
        shell: bash
        run: |
          python3 - <<'PY'
          import re, time, urllib.error, urllib.request
          url = "https://deploy-preview-2--fotopolis-preview.netlify.app/"
          last = None
          for attempt in range(5):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0 FOTOPOLIS-QA"})
                  with urllib.request.urlopen(req, timeout=20) as res:
                      code = res.status
                      body = res.read().decode("utf-8", errors="replace")
                  cards = re.findall(r'class="v4-product-card" id="([^"]+)"', body)
                  no_hero_cta = 'Fotoerlebnisse entdecken' not in body and 'class="v4-hero-actions"' not in body
                  right_copy = "Momente," in body and "Foto Mirror" in body
                  studio = 'class="site-header studio-header"' in body and 'href="/studio-v5.css"' in body and 'src="/studio-v5.js"' in body
                  reference_curve = 'class="studio-header-curve"' in body and 'class="studio-header-curve-stroke"' in body
                  reference_menu = bool(re.search(r'data-menu-toggle[^>]*><span></span><span></span><span></span>', body))
                  css_req = urllib.request.Request(url + "studio-v5.css", headers={"User-Agent":"Mozilla/5.0 FOTOPOLIS-QA"})
                  with urllib.request.urlopen(css_req,timeout=20) as css_res:
                      css_code=css_res.status
                      stylesheet=css_res.read().decode("utf-8",errors="replace")
                  reference_css = css_code==200 and ".studio-header-curve-stroke" in stylesheet and ".studio-header-curve-fill" in stylesheet and ".studio-menu-toggle.mobile-toggle" in stylesheet
                  product_results=[]
                  for slug,canonical in (("fotobox","Fotobox"),("fotospiegel","Fotospiegel"),("fotowohnwagen","Fotowohnwagen")):
                      product_req=urllib.request.Request(url+slug+"/",headers={"User-Agent":"Mozilla/5.0 FOTOPOLIS-QA"})
                      with urllib.request.urlopen(product_req,timeout=20) as product_res:
                          product_status=product_res.status
                          product_html=product_res.read().decode("utf-8",errors="replace")
                      product_valid=(product_status==200 and
                          'data-product-request-section' in product_html and
                          'data-product="'+canonical+'"' in product_html and
                          'href="/product-v6.css"' in product_html and
                          'src="/product-enquiry-v6.js"' in product_html and
                          'id="terminanfrage"' in product_html and
                          'class="s7-story-layout"' in product_html and
                          'data-product-step="1"' in product_html and
                          'data-product-step="2"' in product_html and
                          product_html.index('id="terminanfrage"') < product_html.index('class="page-body"'))
                      product_results.append(product_valid)
                      print("PRODUCT_ROUTE",slug,"HTTP",product_status,"INLINE_REQUEST",product_valid)
                  req=urllib.request.Request(url+"product-v6.css",headers={"User-Agent":"Mozilla/5.0 FOTOPOLIS-QA"})
                  with urllib.request.urlopen(req,timeout=20) as css_resp:
                      product_css_ok=css_resp.status==200 and "STUDIO EDITION 7.0" in css_resp.read().decode("utf-8",errors="replace")
                  req=urllib.request.Request(url+"product-enquiry-v6.js",headers={"User-Agent":"Mozilla/5.0 FOTOPOLIS-QA"})
                  with urllib.request.urlopen(req,timeout=20) as js_resp:
                      product_js_ok=js_resp.status==200 and "data-product-next" in js_resp.read().decode("utf-8",errors="replace")
                  product7=all(product_results) and product_css_ok and product_js_ok
                  print("CSS_STATUS", css_code, "CSS_BYTES", len(stylesheet), "CURVE_RULE", ".studio-header-curve-stroke" in stylesheet)
                  print(f"ATTEMPT={attempt+1} STATUS={code} CARD_ORDER={cards} NO_HERO_CTA={no_hero_cta} RIGHT_COPY={right_copy} STUDIO5={studio} WAVE={reference_curve} MENU3={reference_menu} CSS={reference_css} PRODUCT7={product7}")
                  if code == 200 and cards == ["fotobox","fotospiegel","fotowohnwagen"] and no_hero_cta and right_copy and studio and reference_curve and reference_menu and reference_css and product7:
                      print("PUBLIC_PREVIEW_VERIFIED", url)
                      break
                  last = f"HTTP {code}: wrong, outdated or incomplete Studio 7.0 product preview"
              except Exception as exc:
                  last = repr(exc)
                  print(f"ATTEMPT={attempt+1} ERROR={last}")
              if attempt < 4:
                  time.sleep(6)
          else:
              raise SystemExit("PUBLIC_PREVIEW_UNAVAILABLE_OR_OUTDATED: " + str(last))
          PY
