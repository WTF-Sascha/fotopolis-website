name: Verify FOTOPOLIS preview link is publicly reachable
on:
  push:
    branches: ["design/premium-v2"]
    paths:
      - ".github/workflows/verify-preview-link.yml"
      - "concepts/premium-v2/index.html"
      - "concepts/premium-v2/studio-v5.css"
      - "concepts/premium-v2/studio-v5.js"
      - "scripts/build-premium-preview.py"
      - "scripts/build_premium_pages.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  external-preview-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify real preview URL, HTTP 200 and 4.5.1 homepage content
        shell: bash
        run: |
          python3 - <<'PY'
          import re, time, urllib.error, urllib.request
          url = "https://deploy-preview-2--fotopolis-preview.netlify.app/"
          last = None
          for attempt in range(5):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0 FOTOPOLIS-QA"})
                  with urllib.request.urlopen(req, timeout=20) as res:
                      code = res.status
                      body = res.read().decode("utf-8", errors="replace")
                  cards = re.findall(r'class="v4-product-card" id="([^"]+)"', body)
                  no_hero_cta = 'Fotoerlebnisse entdecken' not in body and 'class="v4-hero-actions"' not in body
                  right_copy = "Momente," in body and "Foto Mirror" in body
                  studio = 'class="site-header studio-header"' in body and 'href="/studio-v5.css"' in body and 'src="/studio-v5.js"' in body
                  reference_curve = 'class="studio-header-curve"' in body and 'class="studio-header-curve-stroke"' in body
                  reference_menu = bool(re.search(r'data-menu-toggle[^>]*><span></span><span></span><span></span>', body))
                  css_req = urllib.request.Request(url + "studio-v5.css", headers={"User-Agent":"Mozilla/5.0 FOTOPOLIS-QA"})
                  with urllib.request.urlopen(css_req,timeout=20) as css_res:
                      css_code=css_res.status
                      stylesheet=css_res.read().decode("utf-8",errors="replace")
                  reference_css = css_code==200 and "FOTOPOLIS REFERENCE-ACCURATE HEADER 5.1" in stylesheet
                  print(f"ATTEMPT={attempt+1} STATUS={code} CARD_ORDER={cards} NO_HERO_CTA={no_hero_cta} RIGHT_COPY={right_copy} STUDIO5={studio} WAVE={reference_curve} MENU3={reference_menu} CSS={reference_css}")
                  if code == 200 and cards == ["fotobox","fotospiegel","fotowohnwagen"] and no_hero_cta and right_copy and studio and reference_curve and reference_menu and reference_css:
                      print("PUBLIC_PREVIEW_VERIFIED", url)
                      break
                  last = f"HTTP {code}: wrong or stale 4.5.1 homepage"
              except Exception as exc:
                  last = repr(exc)
                  print(f"ATTEMPT={attempt+1} ERROR={last}")
              if attempt < 4:
                  time.sleep(6)
          else:
              raise SystemExit("PUBLIC_PREVIEW_UNAVAILABLE_OR_OUTDATED: " + str(last))
          PY
