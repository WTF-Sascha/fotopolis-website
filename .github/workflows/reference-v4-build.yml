name: FOTOPOLIS Reference V4 Build Gate
on:
  push:
    branches: ["design/premium-v2"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
jobs:
  preview-build:
    name: Validate isolated FOTOPOLIS Preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify source syntax and front-end JS
        run: |
          python -m py_compile scripts/build-premium-preview.py scripts/build_premium_pages.py scripts/apply-studio9.py
          node --check concepts/premium-v2/reference-v4.js
          node --check concepts/premium-v2/site.js
          node --check concepts/premium-v2/contact-flow.js
          node --check concepts/premium-v2/product-enquiry-v6.js
          node --check concepts/premium-v2/studio9-design.js
      - name: Generate the exact isolated deploy preview
        run: |
          npm install --no-audit --no-fund
          python3 scripts/build-premium-preview.py
          npm run build:auth
      - name: Validate generated asset and route links
        run: |
          test -f preview-build/index.html
          test -f preview-build/reference-v4.css
          test -f preview-build/reference-v4.js
          test -f preview-build/fotobox/index.html
          test -f preview-build/fotospiegel/index.html
          test -f preview-build/fotowohnwagen/index.html
          test -f preview-build/galerie/index.html
          node scripts/premium-presentation-qa.mjs
          node scripts/gallery-presentation-qa.mjs
          node scripts/standalone-brand-qa.mjs

      - name: Install Chromium for integrated gallery browser QA
        run: |
          npm install --no-audit --no-fund --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify premium product imagery and design gallery in real browser
        run: |
          python3 -m http.server 8766 --directory preview-build > /tmp/fotopolis-presentation-server.log 2>&1 &
          SITE_BASE_URL=http://127.0.0.1:8766/ node scripts/gallery-browser-qa.mjs
          SITE_BASE_URL=http://127.0.0.1:8766/ node scripts/pwa-install-qa.mjs
          SITE_BASE_URL=http://127.0.0.1:8766/ node scripts/studio9-browser-qa.mjs
      - name: Live Netlify Forms smoke probe – synthetic values only
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/studio9-secure-enquiries-mobile-2026-11-08' }}
        run: |
          # One smoke POST, explicitly fictitious data; never use customer addresses.
          http_code=$(curl --silent --show-error --location --output /tmp/studio9-form-response.html --write-out '%{http_code}'             -X POST 'https://deploy-preview-10--fotopolis-preview.netlify.app/kontakt/'             -H 'Content-Type: application/x-www-form-urlencoded'             --data-urlencode 'form-name=fotopolis-studio9-anfrage'             --data-urlencode 'anlass=Hochzeit'             --data-urlencode 'produkt=Fotospiegel'             --data-urlencode 'vorlage=FP-028'             --data-urlencode 'datum=2026-12-12'             --data-urlencode 'name=Studio9 QA Synthetic Only'             --data-urlencode 'email=studio9-qa@invalid.example'             --data-urlencode 'kontaktweg=E-Mail'             --data-urlencode 'datenschutz_ok=Ja'             --data-urlencode 'website=')
          echo "Netlify Forms live synthetic POST status: ${http_code}"
          test "${http_code}" = "200"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fotopolis-presentation-gallery-screenshots
          path: qa-gallery-screenshots/
          if-no-files-found: ignore
