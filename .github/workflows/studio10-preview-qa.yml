name: FOTOPOLIS Studio 15 – Current Browser, Design and Print Release Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'concepts/premium-v2/**'
      - 'scripts/**'
      - 'netlify/functions/**'
      - 'netlify.toml'
      - '.github/workflows/studio10-preview-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-release-regression:
    name: 98 route/viewport checks, safe admin, gold branding and print contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout current candidate (never legacy Studio 11)
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned build and browser dependencies
        run: |
          npm install --no-audit --no-fund
          python -m pip install --disable-pip-version-check "Pillow>=10,<12"
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check JS syntax and build current source
        run: |
          node --check scripts/studio15-release-browser-qa.mjs
          node --check netlify/functions/fotopolis-studio14-form-events.mjs
          node --check scripts/studio14-form-event-qa.mjs
          python3 scripts/build-premium-preview.py
          node scripts/visual-release-qa.mjs
          python3 scripts/harden-studio13.py
          python3 scripts/apply-studio13-unified-brand.py
          npm run build:auth
      - name: Release security, print-source and form-contract gates
        run: |
          node scripts/studio13-private-qa.mjs
          node scripts/studio13-contract-qa.mjs
          node scripts/studio14-print-admin-qa.mjs
          node scripts/studio14-form-event-qa.mjs
          node scripts/studio15-one-app-qa.mjs
          node scripts/staging-secure-qa.mjs
          node --test scripts/test-admin-auth.mjs
      - name: Real browser – current public site and private boundaries
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory preview-build >/tmp/fotopolis-release-qa.log 2>&1 &
          node scripts/studio15-release-browser-qa.mjs
          node scripts/studio13-browser-qa.mjs
          node scripts/studio13-brand-browser-qa.mjs
          SITE_BASE_URL=http://127.0.0.1:8765/ node scripts/hero-welcome-qa.mjs
          SITE_BASE_URL=http://127.0.0.1:8765/ node scripts/studio16-workspace-qa.mjs
      - name: Preserve reproducible screenshots and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio15-release-browser-evidence-${{ github.run_number }}
          path: |
            studio15-release-browser-results/
            studio13-browser-results/
            studio13-brand-screenshots/
            preview-build/qa/studio12-build-audit.json
            preview-build/qa/studio11-build-audit.json
            preview-build/qa/photoprint-44-audit.json
          if-no-files-found: warn
          retention-days: 14
