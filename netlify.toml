[build]
  command = "python3 scripts/build-premium-preview.py && npm run build:auth"
  publish = "preview-build"

[context.deploy-preview]
  command = "python3 scripts/build-premium-preview.py && npm run build:auth"
  publish = "preview-build"

[context.branch-deploy]
  command = "python3 scripts/build-premium-preview.py && npm run build:auth"
  publish = "preview-build"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/admin/login/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://ep-withered-hat-b930f72a.neonauth.c-7.eu-central-1.aws.neon.tech; font-src 'self'; object-src 'none'"
    Cache-Control = "no-store"

[[headers]]
  for = "/admin/dashboard/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://ep-withered-hat-b930f72a.neonauth.c-7.eu-central-1.aws.neon.tech; font-src 'self'; object-src 'none'"
    Cache-Control = "no-store"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, max-age=0"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"
